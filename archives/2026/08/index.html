    <!-- theme: auto-follow OS / persisted preference (no manual toggle) -->
    <script>
    (function(){
        try {
            var KEY = 'indigo-theme';
            var html = document.documentElement;
            var apply = function(mode) {
                if (mode === 'dark') html.classList.add('theme-dark');
                else html.classList.remove('theme-dark');
            };
            var initial = localStorage.getItem(KEY);
            if (initial === 'dark' || initial === 'light') {
                apply(initial);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                apply('dark');
            }
            // Follow OS preference changes live (only when user has not set explicitly)
            if (window.matchMedia) {
                var mq = window.matchMedia('(prefers-color-scheme: dark)');
                var listener = function(e) {
                    if (!localStorage.getItem(KEY)) apply(e.matches ? 'dark' : 'light');
                };
                if (mq.addEventListener) mq.addEventListener('change', listener);
                else if (mq.addListener) mq.addListener(listener);
            }
        } catch (e) {}
    })();
    </script>

<script>
(function () {
    // 访问量接口地址：固定用「当前浏览器访问的地址」+/api（页面部署在哪个域名就上报到哪个域名，
    // 不再取构建时写死的站点 url）；浏览器拿不到 origin 时才回退到主题/站点配置
    var API = (window.location.origin || 'https://blog.wn5.top' || '').replace(/\/+$/, '');
    if (!API) { return; }
    function render(d) {
        if (!d) { return; }
        var t = document.getElementById('wl_visit_today');
        var s = document.getElementById('wl_visit_total');
        if (t && d.today != null) { t.textContent = d.today; }
        if (s && d.total != null) { s.textContent = d.total; }
    }
    // 上报一次访问：同一访客同一天在同一站点只计一次，刷新不会重复增加；接口会回传最新数值
    // 带上当前站点 origin，后台据此区分是哪个站点被访问
    fetch(API + '/api/visit', {
        method: 'POST',
        keepalive: true,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ site: window.location.origin })
    })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d && d.ok) { render(d); } })
        .catch(function () {
            // 上报失败时退化为只读查询
            fetch(API + '/api/visit/stats')
                .then(function (r) { return r.json(); })
                .then(render)
                .catch(function () {});
        });
})();
</script>

<script>
function copyArticleLink(btn) {
    var url = window.location.origin + window.location.pathname.replace(/index\.html$/, '');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function() {
            var tip = btn.querySelector('.copy-tip');
            if (!tip) {
                tip = document.createElement('span');
                tip.className = 'copy-tip';
                tip.style.cssText = 'margin-left:6px;font-size:12px;color:#3F51B5;';
                btn.appendChild(tip);
            }
            tip.textContent = '已复制';
            setTimeout(function() { tip.textContent = ''; }, 2000);
        }).catch(function() { fallbackCopy(url, btn); });
    } else {
        fallbackCopy(url, btn);
    }
}
function fallbackCopy(url, btn) {
    var ta = document.createElement('textarea');
    ta.value = url;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand('copy');
        btn.querySelector('.copy-tip') && (btn.querySelector('.copy-tip').textContent = '已复制');
    } catch(e) {}
    document.body.removeChild(ta);
}
</script>

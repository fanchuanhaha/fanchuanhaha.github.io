name: 仅更新 GitHub Pages

on:
  # 手动触发：重新构建 Hexo 并推送到 gh-pages（不部署 Cloudflare Worker）
  # 后台「发布新文章」时也会调用本工作流，并带上 notify=true 等参数
  workflow_dispatch:
    inputs:
      notify:
        description: "构建完成后通知订阅者（后台发文自动触发时传 true）"
        type: string
        default: "false"
      post_title:
        description: "新文章标题（通知邮件用）"
        type: string
        default: ""
      post_url:
        description: "新文章链接（通知邮件用）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Hexo deps
        run: npm install

      # 站点地址优先级：
      #   1) 仓库 Variables 的 SITE_URL
      #   2) _config.yml 里已填写的自定义域名（不含 github.io，例如 https://blog.wn5.top）
      #   3) 按仓库推导 GitHub Pages 地址（fork 后的默认行为）
      # 自定义域名生效时 root 使用 /，与 GitHub Pages 自定义域名的访问路径一致。
      - name: Set site URL in _config.yml
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="${{ github.repository }}"; NAME="${NAME##*/}"
          CUR="$(grep -E '^url:' _config.yml | head -1 | sed -E "s/^url:[[:space:]]*//; s/[\"']//g; s|[[:space:]]*$||")"
          if [ -n "$SITE_URL_VAR" ]; then
            URL="${SITE_URL_VAR%/}"; ROOT="/"; SRC="仓库变量 SITE_URL"
          elif [ -n "$CUR" ] && ! echo "$CUR" | grep -q 'github\.io'; then
            URL="${CUR%/}"; ROOT="/"; SRC="_config.yml 自定义域名"
          elif [ "$(echo "$NAME" | tr 'A-Z' 'a-z')" = "$(echo "$OWNER" | tr 'A-Z' 'a-z').github.io" ]; then
            URL="https://$OWNER.github.io"; ROOT="/"; SRC="按仓库推导"
          else
            URL="https://$OWNER.github.io/$NAME"; ROOT="/$NAME/"; SRC="按仓库推导"
          fi
          sed -i "/^root: /d" _config.yml
          sed -i "s|^url: .*|url: $URL\nroot: $ROOT|" _config.yml
          echo "site url -> $URL  root -> $ROOT  ($SRC)"

      - name: Generate site
        run: npx hexo generate

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd public || exit 1
          git init -q
          git config user.name "deployer"
          git config user.email "deployer@users.noreply.github.com"
          git add -A
          git commit -m "deploy: $GITHUB_SHA" -q
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:gh-pages -q

      # 构建已完成 → 通知订阅者。只有后台「发布新文章」触发时 notify 才为 true；
      # 手动运行工作流默认 false，不会发邮件。
      - name: 通知订阅者（仅后台发文自动触发时执行）
        if: ${{ inputs.notify == 'true' }}
        env:
          NOTIFY_SECRET: ${{ secrets.GH_TOKEN }}
          POST_TITLE: ${{ inputs.post_title }}
          POST_URL: ${{ inputs.post_url }}
          # 通知回调地址：优先仓库变量 SITE_URL，否则回退到站点域名
          NOTIFY_URL: ${{ vars.SITE_URL || 'https://blog.wn5.top' }}
        run: |
          curl -sS -m 60 -X POST "${NOTIFY_URL}/api/internal/notify-published" \
            -H "Content-Type: application/json" \
            -H "x-notify-secret: ${NOTIFY_SECRET}" \
            -d "$(jq -n --arg t "$POST_TITLE" --arg u "$POST_URL" '{title:$t,url:$u}')"
          echo ""
